    <div class="app-shell" style="grid-template-columns: 1fr;">

            <div class="course-detail-container">
                <div id="courseLoading" class="loading">
                    <p>Loading course details...</p>
                </div>

                <div id="courseContent" style="display: none;">

                        <div>
                            <h1 id="courseTitle"></h1>
                            <p id="courseDescription"></p>

                        </div>

                            <div class="course-price" id="coursePrice"></div>
                            <button id="enrollButton" class="enroll-button">Enroll Now</button>

                                <strong>Students</strong>
                                <span id="enrollmentCount">0 enrolled</span>
                            </div>
                            <div class="sidebar-info">
                                <strong>Duration</strong>
                                <span id="courseDuration"></span>
                            </div>
                            <div class="sidebar-info">
                                <strong>Level</strong>
                                <span id="courseLevel"></span>
                            </div>

                                <strong>Category</strong>
                                <span id="courseCategory"></span>
                            </div>

                        <button class="tab-button active" data-tab="overview">Overview</button>

                    </div>

                        <div class="content-section">
                            <h2>About This Course</h2>
                            <p id="fullDescription"></p>
                            <h3>What You'll Learn</h3>
                            <div id="learningOutcomes"></div>
                        </div>
                    </div>

                    <div id="lessons" class="tab-content">
                        <div class="content-section">
                            <h2>Course Lessons</h2>
                            <div id="lessonsList"></div>
                        </div>
                    </div>

                    <div id="instructor" class="tab-content">
                        <div class="content-section">

                            <div id="instructorCard"></div>
                        </div>
                    </div>

    </div>

    <script>
        const courseId = new URLSearchParams(window.location.search).get('id');

        async function getCsrfToken() {
            const response = await fetch('api.php?action=csrf-token', { credentials: 'same-origin' });
            const result = await response.json();
            if (!result.success || !result.data?.csrf_token) {
                throw new Error(result.message || 'Unable to initialize request security.');
            }
            return result.data.csrf_token;
        }

        if (!courseId) {
            document.querySelector('.course-detail-container').innerHTML = '<div class="empty-box">Course not found</div>';
        } else {
            loadCourseDetails();
        }

        async function loadCourseDetails() {
            try {
                const response = await fetch(`api.php?action=course&id=${encodeURIComponent(courseId)}`);
                const result = await response.json();

                if (!result.success) {
                    throw new Error(result.message || 'Failed to load course');
                }

                renderCourse(result.data);
            } catch (error) {
                document.getElementById('courseLoading').innerHTML = `<div class="empty-box">Error: ${error.message}</div>`;
            }
        }

        function renderCourse(course) {
            document.getElementById('courseLoading').style.display = 'none';
            document.getElementById('courseContent').style.display = 'block';

            // Hero section
            document.getElementById('courseTitle').textContent = course.title;
            document.getElementById('courseDescription').textContent = course.description;
            document.getElementById('courseDuration').textContent = course.duration;
            document.getElementById('courseLevel').textContent = course.level;
            document.getElementById('courseCategory').textContent = course.category;
            document.getElementById('enrollmentCount').textContent = `${course.enrollment_count || 0} students enrolled`;
            document.getElementById('fullDescription').textContent = course.description;

            // Price
            const priceEl = document.getElementById('coursePrice');
            if (course.price && course.price > 0) {
                priceEl.textContent = `$${course.price}`;
                priceEl.classList.remove('free');
            } else {
                priceEl.textContent = 'Free';
                priceEl.classList.add('free');
            }

            // Meta badges
            const metaHtml = `
                <div class="course-info-badge">${course.level}</div>
                <div class="course-info-badge">${course.category}</div>
                <div class="course-info-badge">⏱️ ${course.duration}</div>
            `;
            document.getElementById('courseMeta').innerHTML = metaHtml;

            // Learning outcomes
            if (course.outcomes && course.outcomes.length) {
                document.getElementById('learningOutcomes').innerHTML = course.outcomes
                    .map(outcome => `<div class="lesson-item">✓ ${outcome}</div>`)
                    .join('');
            }

            // Lessons
            if (course.lessons && course.lessons.length) {
                document.getElementById('lessonsList').innerHTML = course.lessons
                    .map((lesson, idx) => `
                        <div class="lesson-item">
                            <strong>Lesson ${idx + 1}: ${lesson.title}</strong>
                            <small>${lesson.duration || '30 min'} • ${lesson.type || 'Video'}</small>
                        </div>
                    `)
                    .join('');
            }

            // Instructor
            if (course.instructor_name) {
                document.getElementById('instructorCard').innerHTML = `
                    <div class="instructor-card">
                        <div class="instructor-avatar">${course.instructor_name.charAt(0).toUpperCase()}</div>
                        <div class="instructor-info">
                            <h4>${course.instructor_name}</h4>
                            <p>${course.instructor_bio || 'Professional Instructor'}</p>
                        </div>
                    </div>
                `;
            }

            // Enroll button
            const enrollBtn = document.getElementById('enrollButton');
            if (course.is_enrolled) {
                enrollBtn.textContent = 'Already Enrolled';
                enrollBtn.classList.add('enrolled');
                enrollBtn.disabled = true;
            } else {
                enrollBtn.onclick = () => enrollCourse(course);
            }
        }

        async function enrollCourse(course) {
            if (!confirm(`Enroll in "${course.title}"?`)) return;

            try {
                const csrfToken = await getCsrfToken();
                const response = await fetch('api.php?action=enroll', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
                    body: JSON.stringify({ course_id: courseId }),
                });

                const result = await response.json();

                if (!result.success) {
                    alert(result.message || 'Enrollment failed');
                    return;
                }

                alert('Successfully enrolled!');
                location.reload();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        // Tab switching
        document.querySelectorAll('.tab-button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.add('active');
            });
        });
    </script>
