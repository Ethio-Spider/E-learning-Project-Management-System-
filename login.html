<body>
    <div class="login-container">
        <div class="login-header">

        </div>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <div class="demo-info">
            <strong>Demo Credentials:</strong>
            <p><strong>Student:</strong> student@learnflow.app / student123</p>
            <p><strong>Instructor:</strong> instructor@learnflow.app / instructor123</p>
            <p><strong>Admin:</strong> admin@learnflow.app / admin123</p>
        </div>

        <form id="loginForm" class="form-section">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="you@learnflow.app">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>

            <div class="form-group">
                <label for="role">Login as</label>
                <select id="role" name="role" required>
                    <option value="student">Student</option>
                    <option value="instructor">Instructor</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <div class="remember-forgot">
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" id="remember" name="remember" style="width: 18px; height: 18px; cursor: pointer;">
                    Remember me
                </label>
                <a href="#forgot">Forgot password?</a>
            </div>

            <button type="submit" class="btn-login">
                <span class="loading-spinner" id="loadingSpinner"></span>
                <span id="buttonText">Sign In</span>
            </button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="register.html">Create one</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMessage');
        const successMsg = document.getElementById('successMessage');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const buttonText = document.getElementById('buttonText');

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
            successMsg.style.display = 'none';
        }

        function showSuccess(message) {
            successMsg.textContent = message;
            successMsg.style.display = 'block';
            errorMsg.style.display = 'none';
        }

        function hideMessages() {
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const role = document.getElementById('role').value;

            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }

            loadingSpinner.style.display = 'inline-block';
            buttonText.textContent = 'Signing in...';
            form.querySelector('button').disabled = true;

            try {
                const response = await fetch(`api.php?action=login&role=${encodeURIComponent(role)}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });

                const result = await response.json();

                if (!response.ok || !result.success) {
                    showError(result.message || 'Login failed');
                    return;
                }

                showSuccess('Login successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = 'index.php';
                }, 1500);
            } catch (error) {
                showError('Connection error: ' + error.message);
            } finally {
                loadingSpinner.style.display = 'none';
                buttonText.textContent = 'Sign In';
                form.querySelector('button').disabled = false;
            }
        });

        // Pre-fill with demo credentials if needed
        if (new URLSearchParams(window.location.search).get('demo') === 'student') {
            document.getElementById('email').value = 'student@learnflow.app';
            document.getElementById('password').value = 'student123';
        }
    </script>
