<body>
    <div class="app-shell" style="grid-template-columns: 1fr;">
        <main class="main-panel">
            <header class="topbar">
                <div>
                    <p class="eyebrow">LearnFlow Pro</p>
                    <h2>User Management</h2>
                </div>
                <div class="topbar-actions">
                    <button class="btn btn-primary" onclick="openNewUserModal()">+ Add User</button>
                    <button class="btn btn-secondary" onclick="loadUsers()">Refresh</button>
                </div>
            </header>

            <div class="admin-toolbar">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search users by name or email..." onkeyup="filterUsers()">
                </div>
                <div style="display: flex; gap: 12px;">
                    <select id="roleFilter" onchange="filterByRole()" style="padding: 10px 14px; border-radius: 10px; border: 1px solid #dfe7ff;">
                        <option value="">All Roles</option>
                        <option value="student">Students</option>
                        <option value="instructor">Instructors</option>
                        <option value="admin">Admins</option>
                    </select>
                </div>
            </div>

            <div class="users-table">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Joined</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="5" style="text-align: center; padding: 40px;">Loading users...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </main>
    </div>

    <!-- New User Modal -->
    <div id="newUserModal" class="modal">
        <div class="modal-content" style="position: relative;">
            <button class="modal-close" onclick="closeModal('newUserModal')">×</button>
            <div class="modal-header">
                <h2>Add New User</h2>
                <p>Create a new user account</p>
            </div>
            <form id="newUserForm">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="8">
                </div>
                <div class="form-group">
                    <label for="role">Role</label>
                    <select id="role" name="role" required>
                        <option value="student">Student</option>
                        <option value="instructor">Instructor</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-secondary-modal" onclick="closeModal('newUserModal')">Cancel</button>
                    <button type="submit" class="btn-primary-modal">Create User</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete User Modal -->
    <div id="deleteUserModal" class="modal">
        <div class="modal-content" style="position: relative;">
            <button class="modal-close" onclick="closeModal('deleteUserModal')">×</button>
            <div class="modal-header">
                <h2>Delete User?</h2>
                <p>This action cannot be undone.</p>
            </div>
            <p id="deleteUserMessage" style="color: #5d6b82;"></p>
            <div class="modal-actions">
                <button type="button" class="btn-secondary-modal" onclick="closeModal('deleteUserModal')">Cancel</button>
                <button type="button" class="btn-delete" style="padding: 10px 16px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer;" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let allUsers = [];
        let usersToDelete = null;

        async function getCsrfToken() {
            const response = await fetch('api.php?action=csrf-token', { credentials: 'same-origin' });
            const result = await response.json();
            if (!result.success || !result.data?.csrf_token) {
                throw new Error(result.message || 'Unable to initialize request security.');
            }
            return result.data.csrf_token;
        }

        loadUsers();

        async function loadUsers() {
            try {
                const response = await fetch(`api.php?action=admin-users&page=${currentPage}`);
                const result = await response.json();

                if (!result.success) {
                    alert('Failed to load users: ' + result.message);
                    return;
                }

                allUsers = result.data.users || [];
                renderUsers(allUsers);
                renderPagination(result.data.pagination);
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('usersTableBody');

            if (!users.length) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; padding: 40px;">No users found</td></tr>';
                return;
            }

            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>
                        <span class="user-name">${user.first_name} ${user.last_name}</span>
                        <span class="user-email">${user.email}</span>
                    </td>
                    <td>${user.email}</td>
                    <td><span class="role-badge ${user.role}">${user.role}</span></td>
                    <td>${new Date(user.created_at).toLocaleDateString()}</td>
                    <td>
                        <div class="user-actions">
                            <button class="btn-small" onclick="editUser(${user.id})">Edit</button>
                            <button class="btn-small btn-delete" onclick="deleteUser(${user.id}, '${user.first_name} ${user.last_name}')">Delete</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function renderPagination(pagination) {
            const container = document.getElementById('paginationContainer');
            if (pagination.total_pages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            for (let i = 1; i <= pagination.total_pages; i++) {
                const active = i === currentPage ? 'active' : '';
                html += `<button class="${active}" onclick="goToPage(${i})">${i}</button>`;
            }
            container.innerHTML = html;
        }

        function filterUsers() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allUsers.filter(user =>
                user.first_name.toLowerCase().includes(searchTerm) ||
                user.last_name.toLowerCase().includes(searchTerm) ||
                user.email.toLowerCase().includes(searchTerm)
            );
            renderUsers(filtered);
        }

        function filterByRole() {
            const role = document.getElementById('roleFilter').value;
            if (!role) {
                renderUsers(allUsers);
            } else {
                renderUsers(allUsers.filter(u => u.role === role));
            }
        }

        function openNewUserModal() {
            document.getElementById('newUserForm').reset();
            document.getElementById('newUserModal').classList.add('active');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        function deleteUser(userId, userName) {
            usersToDelete = { id: userId, name: userName };
            document.getElementById('deleteUserMessage').textContent = `Are you sure you want to delete ${userName}?`;
            document.getElementById('deleteUserModal').classList.add('active');
        }

        async function confirmDelete() {
            if (!usersToDelete) return;

            try {
                const csrfToken = await getCsrfToken();
                const response = await fetch('api.php?action=delete-user', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
                    body: JSON.stringify({ user_id: usersToDelete.id }),
                });

                const result = await response.json();

                if (!result.success) {
                    alert('Failed to delete user: ' + result.message);
                    return;
                }

                alert('User deleted successfully');
                closeModal('deleteUserModal');
                loadUsers();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function editUser(userId) {
            alert('Edit functionality coming soon');
        }

        function goToPage(page) {
            currentPage = page;
            loadUsers();
        }

        document.getElementById('newUserForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                first_name: document.getElementById('firstName').value,
                last_name: document.getElementById('lastName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value,
            };

            try {
                const csrfToken = await getCsrfToken();
                const response = await fetch('api.php?action=register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
                    body: JSON.stringify(formData),
                });

                const result = await response.json();

                if (!result.success) {
                    alert('Failed to create user: ' + result.message);
                    return;
                }

                alert('User created successfully');
                closeModal('newUserModal');
                loadUsers();
            } catch (error) {
                alert('Error: ' + error.message);
            }
        });
    </script>
</body>
</html>
