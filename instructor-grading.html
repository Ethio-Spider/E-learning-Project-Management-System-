    <script>
        let currentSubmission = null;

        loadSubmissions();

        async function loadSubmissions() {
            try {
                const response = await fetch('api.php?action=grading-submissions');
                const result = await response.json();

                if (!result.success) {
                    showError('Failed to load submissions');
                    return;
                }

                renderSubmissions(result.data);
            } catch (error) {
                showError('Error: ' + error.message);
            }
        }

        function renderSubmissions(data) {
            const listEl = document.getElementById('submissionsList');
            
            if (!data.submissions || data.submissions.length === 0) {
                listEl.innerHTML = '<p style="color: #5d6b82; text-align: center;">No submissions yet</p>';
                return;
            }

            listEl.innerHTML = data.submissions.map(sub => `
                <div class="submission-card" data-id="${sub.id}">
                    <div class="submission-header">
                        <div class="submission-name">${sub.student_name}</div>
                        <span class="submission-status ${sub.status.toLowerCase()}">${sub.status}</span>
                    </div>
                    <div class="submission-meta">
                        <div>${sub.assignment_title}</div>
                        <div>Submitted: ${new Date(sub.submitted_at).toLocaleDateString()}</div>
                    </div>
                </div>
            `).join('');

            listEl.querySelectorAll('.submission-card').forEach(card => {
                card.addEventListener('click', () => {
                    listEl.querySelectorAll('.submission-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    const id = card.dataset.id;
                    const sub = data.submissions.find(s => s.id == id);
                    if (sub) displaySubmission(sub);
                });
            });
        }

        function displaySubmission(submission) {
            currentSubmission = submission;
            document.getElementById('noSelection').style.display = 'none';
            document.getElementById('gradingContent').style.display = 'block';

            document.getElementById('submissionTitle').textContent = submission.assignment_title;
            document.getElementById('submissionCourse').textContent = submission.course_title;
            document.getElementById('studentName').textContent = submission.student_name;
            document.getElementById('submissionDate').textContent = new Date(submission.submitted_at).toLocaleDateString();
            document.getElementById('currentStatus').innerHTML = `<span class="submission-status ${submission.status.toLowerCase()}">${submission.status}</span>`;

            const textContent = document.getElementById('submissionTextContent');
            if (submission.submission_text) {
                textContent.innerHTML = `<h4 style="color: #172033; margin-top: 0;">Text Submission:</h4><p>${submission.submission_text}</p>`;
            } else {
                textContent.innerHTML = '';
            }

            const fileContent = document.getElementById('submissionFileContent');
            if (submission.file_url) {
                fileContent.innerHTML = `<h4 style="color: #172033; margin: 0;">Attached File:</h4><p><a href="${submission.file_url}" target="_blank" style="color: #4f46e5; text-decoration: none; font-weight: 700;">📄 ${submission.file_name || 'Download File'}</a></p>`;
            }

            if (submission.status === 'Graded' && submission.score) {
                document.getElementById('score').value = submission.score;
                document.getElementById('feedback').value = submission.feedback || '';
                document.getElementById('submitGradeBtn').textContent = 'Update Grade';
            } else {
                document.getElementById('score').value = '';
                document.getElementById('feedback').value = '';
                document.getElementById('submitGradeBtn').textContent = 'Submit Grade';
            }
        }

        document.getElementById('gradingForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const score = parseFloat(document.getElementById('score').value);
            const feedback = document.getElementById('feedback').value.trim();

            if (!score || score < 0) {
                showError('Please enter a valid score');
                return;
            }

            const btn = document.getElementById('submitGradeBtn');
            btn.disabled = true;

            try {
                const response = await fetch('api.php?action=grade-submission', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        submission_id: currentSubmission.id,
                        score,
                        feedback,
                        max_score: 100,
                    }),
                });

                const result = await response.json();

                if (!result.success) {
                    showError(result.message || 'Failed to grade submission');
                    btn.disabled = false;
                    return;
                }

                showSuccess('Grade submitted successfully!');
                setTimeout(() => loadSubmissions(), 1500);
            } catch (error) {
                showError('Error: ' + error.message);
                btn.disabled = false;
            }
        });

        function showError(msg) {
            const el = document.getElementById('errorMessage');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMessage');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
        }
    </script>
</body>
