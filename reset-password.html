<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset your LearnFlow Pro password">
    <title>Reset Password - LearnFlow Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="auth-shell reset-shell">
        <section class="brand-panel">
            <div class="brand-badge">LF</div>
            <p class="eyebrow">Account recovery</p>
            <h1>Choose a new password.</h1>
            <p>Use a strong password that you do not reuse on another account.</p>
        </section>
        <section class="card-panel">
            <div class="auth-card">
                <div class="auth-header">
                    <h2>Reset password</h2>
                    <p>Set a new password for your account.</p>
                </div>
                <div id="resetMessage" class="message"></div>
                <form id="resetForm">
                    <div class="field-group">
                        <label for="newPassword">New password</label>
                        <input id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
                    </div>
                    <div class="field-group">
                        <label for="confirmPassword">Confirm password</label>
                        <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Repeat your password" required>
                    </div>
                    <button class="submit-btn" type="submit">Update password</button>
                </form>
                <div class="sign-switch"><a href="login.html">Return to sign in</a></div>
            </div>
        </section>
    </main>
    <script>
        const resetForm = document.getElementById('resetForm');
        const resetMessage = document.getElementById('resetMessage');
        const resetToken = new URLSearchParams(window.location.search).get('token') || '';

        function showResetMessage(type, message) {
            resetMessage.className = `message ${type}`;
            resetMessage.textContent = message;
        }

        resetForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const password = document.getElementById('newPassword').value;
            const confirmation = document.getElementById('confirmPassword').value;

            if (!resetToken) {
                showResetMessage('error', 'This reset link is missing or invalid. Request a new one.');
                return;
            }
            if (password.length < 8) {
                showResetMessage('error', 'Your password must be at least 8 characters.');
                return;
            }
            if (password !== confirmation) {
                showResetMessage('error', 'Passwords do not match.');
                return;
            }

            const submitButton = resetForm.querySelector('button');
            submitButton.disabled = true;
            try {
                const response = await fetch('api.php?action=reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: resetToken, password })
                });
                const result = await response.json();
                if (!response.ok || !result.success) throw new Error(result.message || 'Password reset failed.');
                showResetMessage('success', 'Password updated. Redirecting to sign in...');
                setTimeout(() => { window.location.replace('login.html'); }, 1200);
            } catch (error) {
                showResetMessage('error', error.message);
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
